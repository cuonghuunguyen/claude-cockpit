[package]
name = "cockpit-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rand = "0.10.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
# Wraps a tokio::sync::broadcast::Receiver as a Stream for axum's SSE
# response type (axum::response::sse::Sse requires a Stream, which axum
# itself does not publicly re-export). Same publisher (tokio-rs org) as the
# already-approved `tokio` dependency.
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# Test-only: drives the real router over real HTTP for integration tests
# (auth 401/200, upsert-not-duplicate, no-CORS). Same crate already approved
# and in use by app/src-tauri (Plan 01-01 Package Legitimacy Audit).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
